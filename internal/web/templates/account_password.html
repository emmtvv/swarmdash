{{define "account_password.html"}}
<h1>{{t "common.change_password"}}</h1>

{{if .Force}}
<div class="error-box">
	{{t "account_password.password_change_is_required_before"}}
</div>
{{else}}
<p class="muted">{{t "account_password.update_the_password_for_your"}}</p>
{{end}}

{{if .Error}}<div class="error-box">{{t .Error}}</div>{{end}}

<div class="card" style="max-width:420px;">
	<form method="post" action="/account/password">
		<div class="form-grid">
			<div>
				<label for="current_password">{{t "common.current_password"}}</label>
				<input type="password" id="current_password" name="current_password" autofocus required style="width:100%;">
			</div>
			<div>
				<label for="new_password">{{t "account_password.new_password"}}</label>
				<input type="password" id="new_password" name="new_password" required style="width:100%;">
			</div>
			<div>
				<label for="confirm_password">{{t "account_password.confirm_new_password"}}</label>
				<input type="password" id="confirm_password" name="confirm_password" required style="width:100%;">
			</div>
		</div>

		<button type="submit" class="btn" style="margin-top:22px;">{{t "common.change_password"}}</button>
	</form>
</div>
{{end}}
