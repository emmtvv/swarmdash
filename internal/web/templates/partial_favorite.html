{{/* fav-star renders a favorite toggle; expects dict "User" "Kind" "Name". */}}
{{define "fav-star"}}{{$on := isFavorite .User.Favorites .Kind .Name}}<button type="button" class="fav-star{{if $on}} on{{end}}" data-fav-kind="{{.Kind}}" data-fav-name="{{.Name}}" aria-pressed="{{if $on}}true{{else}}false{{end}}" title="{{if $on}}{{t "common.remove_from_favorites"}}{{else}}{{t "common.add_to_favorites"}}{{end}}" aria-label="{{if $on}}{{t "common.remove_from_favorites"}}{{else}}{{t "common.add_to_favorites"}}{{end}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.2 L14.7 8.7 L20.7 9.6 L16.35 13.85 L17.4 19.85 L12 17 L6.6 19.85 L7.65 13.85 L3.3 9.6 L9.3 8.7 Z"/></svg></button>{{end}}
