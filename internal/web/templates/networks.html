{{define "networks.html"}}
<h1>{{t "Networks"}}</h1>

<div class="card">
	<h2 style="margin-top:0;">{{t "Create network"}}</h2>
	<form method="post" action="/networks">
		<div class="card-row">
			<div>
				<label for="name">{{t "Name"}}</label>
				<input type="text" id="name" name="name" required>
			</div>
			<div>
				<label for="driver">{{t "Driver"}}</label>
				<input type="text" id="driver" name="driver" value="overlay">
			</div>
			<div>
				<label>&nbsp;</label>
				<label><input type="checkbox" name="attachable" checked> {{t "Attachable"}}</label>
			</div>
			<div>
				<label>&nbsp;</label>
				<label><input type="checkbox" name="internal"> {{t "Internal"}}</label>
			</div>
			<div>
				<label>&nbsp;</label>
				<button type="submit" class="btn">{{t "Create"}}</button>
			</div>
		</div>
	</form>
</div>

<table>
	<thead><tr><th>{{t "Name"}}</th><th>{{t "Driver"}}</th><th>{{t "Scope"}}</th><th>{{t "Attachable"}}</th><th>{{t "Ingress"}}</th><th></th></tr></thead>
	<tbody>
	{{range .Networks}}
		<tr>
			<td class="mono">{{.Name}}</td>
			<td>{{.Driver}}</td>
			<td>{{.Scope}}</td>
			<td>{{.Attachable}}</td>
			<td>{{.Ingress}}</td>
			<td>
				<form class="inline" method="post" action="/networks/{{.ID}}/delete" data-confirm="{{t "Delete network %v?" .Name}}">
					<button type="submit" class="btn danger small">{{t "Delete"}}</button>
				</form>
			</td>
		</tr>
	{{else}}
		<tr><td colspan="6" class="muted">{{t "No swarm-scoped networks."}}</td></tr>
	{{end}}
	</tbody>
</table>
{{end}}
