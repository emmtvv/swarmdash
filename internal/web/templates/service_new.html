{{define "service_new.html"}}
<div class="breadcrumb"><a href="/services">{{t "common.services"}}</a> {{t "service_new.new_service"}}</div>
<h1>{{t "common.new_service"}}</h1>

{{if .Error}}<div class="error-box">{{.Error}}</div>{{end}}

<form method="post" action="/services">
	<div class="card">
		<div class="card-row">
			<div>
				<label for="name">{{t "common.name"}}</label>
				<input type="text" id="name" name="name" value="{{.Form.Name}}" required pattern="[a-zA-Z0-9][a-zA-Z0-9_.\-]*" style="width:220px;">
			</div>
			<div>
				<label for="stack">{{t "service_new.stack_optional"}}</label>
				<input type="text" id="stack" name="stack" value="{{.Form.Stack}}" pattern="[a-zA-Z0-9][a-zA-Z0-9_.\-]*" placeholder="{{t "common.none"}}" style="width:180px;">
			</div>
			<div style="flex:1 1 280px;">
				<label for="image">{{t "common.image"}}</label>
				<input type="text" id="image" name="image" value="{{.Form.Image}}" required placeholder="nginx:alpine" style="width:100%;font-family:ui-monospace,monospace;">
			</div>
			<div>
				<label for="mode">{{t "common.mode"}}</label>
				<select id="mode" name="mode" style="width:130px;">
					<option value="replicated" {{if eq .Form.Mode "replicated"}}selected{{end}}>{{t "common.replicated"}}</option>
					<option value="global" {{if eq .Form.Mode "global"}}selected{{end}}>{{t "common.global"}}</option>
				</select>
			</div>
			<div>
				<label for="replicas">{{t "common.replicas"}}</label>
				<input type="number" id="replicas" name="replicas" value="{{.Form.Replicas}}" min="0" style="width:90px;">
			</div>
		</div>
		<p class="muted" style="margin-bottom:0;">{{tHTML "service_new.with_a_stack_the_service"}}</p>
	</div>

	<div class="card">
		{{template "service_fields" .Editor}}
		<button type="submit" class="btn" style="margin-top:16px;">{{t "service_new.create_service"}}</button>
	</div>
</form>
{{end}}
