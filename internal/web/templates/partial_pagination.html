{{define "pagination"}}
{{if gt .TotalPages 1}}
<div class="pagination">
	<span class="muted">{{t "pagination.page_of_total" .Page .TotalPages .Total}}</span>
	<div class="pagination-nav">
		{{if .HasPrev}}<a class="btn secondary small" href="{{.PrevURL}}">{{t "pagination.prev"}}</a>{{else}}<span class="btn secondary small disabled">{{t "pagination.prev"}}</span>{{end}}
		{{if .HasNext}}<a class="btn secondary small" href="{{.NextURL}}">{{t "pagination.next"}}</a>{{else}}<span class="btn secondary small disabled">{{t "pagination.next"}}</span>{{end}}
	</div>
</div>
{{end}}
{{end}}
