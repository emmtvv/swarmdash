{{define "pagination"}}
{{if gt .TotalPages 1}}
<div class="pagination">
	<span class="muted">{{t "Page %v of %v · %v total" .Page .TotalPages .Total}}</span>
	<div class="pagination-nav">
		{{if .HasPrev}}<a class="btn secondary small" href="{{.PrevURL}}">{{t "← Prev"}}</a>{{else}}<span class="btn secondary small disabled">{{t "← Prev"}}</span>{{end}}
		{{if .HasNext}}<a class="btn secondary small" href="{{.NextURL}}">{{t "Next →"}}</a>{{else}}<span class="btn secondary small disabled">{{t "Next →"}}</span>{{end}}
	</div>
</div>
{{end}}
{{end}}
