{{define "account_recovery_codes.html"}}
<h1>{{t "account_recovery_codes.recovery_codes"}}</h1>
<div class="warn-box">{{t "account_recovery_codes.save_these_codes_somewhere_safe"}}</div>
<div class="card" style="max-width:420px;">
	<ul class="recovery-codes mono">
		{{range .Codes}}<li>{{.}}</li>{{end}}
	</ul>
	<button type="button" class="btn secondary small" data-copy-text="{{range .Codes}}{{.}}
{{end}}">{{t "account_recovery_codes.copy"}}</button>
</div>
<a href="/account/security" class="btn">{{t "account_recovery_codes.done"}}</a>
{{end}}
