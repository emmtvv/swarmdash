{{define "secrets.html"}}
<h1>Secrets</h1>

<div class="card">
	<h2 style="margin-top:0;">Create secret</h2>
	<p class="muted" style="margin-top:0;">Docker secrets are write-only - once created, the value can never be read back through the API (by swarmdash or anyone else).</p>
	<form method="post" action="/secrets">
		<label for="name">Name</label>
		<input type="text" id="name" name="name" required style="width:320px;">
		<label for="data">Value</label>
		<textarea id="data" name="data" rows="4" style="width:100%;font-family:ui-monospace,monospace;" required></textarea>
		<button type="submit" class="btn" style="margin-top:12px;">Create</button>
	</form>
</div>

<table>
	<thead><tr><th>Name</th><th>Created</th><th></th></tr></thead>
	<tbody>
	{{range .Secrets}}
		<tr>
			<td class="mono">{{.Spec.Name}}</td>
			<td class="muted">{{ago .CreatedAt}}</td>
			<td>
				<form class="inline" method="post" action="/secrets/{{.ID}}/delete" data-confirm="Delete secret {{.Spec.Name}}? Services still using it will fail to (re)start.">
					<button type="submit" class="btn danger small">Delete</button>
				</form>
			</td>
		</tr>
	{{else}}
		<tr><td colspan="3" class="muted">No secrets.</td></tr>
	{{end}}
	</tbody>
</table>
{{end}}
