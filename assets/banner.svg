<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="swarmdash">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f86ff"/>
      <stop offset="55%" stop-color="#2b53c9"/>
      <stop offset="100%" stop-color="#141f45"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="12%" r="70%">
      <stop offset="0%" stop-color="#7aa2ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7aa2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="28" fill="url(#glow)"/>

  <!-- decorative swarm-node texture, top-right -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.18">
    <line x1="900" y1="70" x2="970" y2="40"/>
    <line x1="900" y1="70" x2="960" y2="105"/>
    <line x1="900" y1="70" x2="1030" y2="70"/>
    <line x1="1030" y1="70" x2="1080" y2="35"/>
    <line x1="1030" y1="70" x2="1090" y2="100"/>
    <line x1="960" y1="105" x2="1010" y2="145"/>
  </g>
  <g fill="#ffffff" opacity="0.28">
    <circle cx="900" cy="70" r="4"/>
    <circle cx="970" cy="40" r="3"/>
    <circle cx="960" cy="105" r="3"/>
    <circle cx="1030" cy="70" r="4"/>
    <circle cx="1080" cy="35" r="3"/>
    <circle cx="1090" cy="100" r="3"/>
    <circle cx="1010" cy="145" r="3"/>
  </g>

  <!-- brand mark: hub + three swarm nodes, matching internal/web/static/favicon.svg -->
  <g transform="translate(78,50) scale(5)">
    <g stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.6">
      <line x1="16" y1="16" x2="16" y2="27.5"/>
      <line x1="16" y1="16" x2="6.04" y2="10.25"/>
      <line x1="16" y1="16" x2="25.96" y2="10.25"/>
    </g>
    <circle cx="16" cy="27.5" r="2" fill="#ffffff"/>
    <circle cx="6.04" cy="10.25" r="2" fill="#ffffff"/>
    <circle cx="25.96" cy="10.25" r="2" fill="#ffffff"/>
    <circle cx="16" cy="16" r="4.6" fill="#ffffff"/>
  </g>

  <text x="300" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#ffffff" letter-spacing="-1">swarmdash</text>
  <text x="302" y="184" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#c7d5ff">Docker Swarm admin panel &#8212; one Go binary, agent + admin</text>
</svg>
