# Deploys swarmdash onto an existing Swarm cluster: `admin` on manager
# nodes, `agent` on every node (including managers, so you can exec into
# containers scheduled there too).
#
# admin persists all of its state (users, sessions, audit log, tokens, ...)
# in a local SQLite database (--storage-driver=local, the swarmdash
# default), kept on the swarmdash_data volume below so it survives restarts
# and redeploys. That's a single file on one node's disk, so admin is
# pinned to a manager and kept at deploy.replicas: 1 - see "Optional: HA
# admin" further down if you want more than one replica.
#
# Credentials (cluster secret) are passed as a plain environment variable,
# interpolated (${VAR} below) from whatever process environment `docker
# stack deploy` itself runs in - NOT a Docker secret. Unlike `docker
# compose`, `docker stack deploy` does NOT read a .env file on its own, so
# that var has to actually be exported into your shell first; `make deploy`
# does that for you (see its recipe), or do it by hand: `set -a; . ./.env;
# set +a; docker stack deploy ...`. Once deployed, the value is visible in
# `docker service inspect` / `docker inspect` on the container, unlike a
# secret's tmpfs-only mount. Simpler to manage (edit .env + redeploy, no
# immutable-secret dance), but only reach for this on a cluster you already
# trust for that tradeoff. If you want the Docker-secrets version back, the
# app supports both - every SWARMDASH_* var below also has a "_FILE"
# variant that reads from a mounted file (see README's Hardening section).
#
# One-shot bring-up (build image + generate .env + deploy), from a manager
# node with this repo checked out:
#
#      make deploy
#
# Or step by step:
#   1. docker build -t swarmdash:latest .   (or push/load it on every node)
#   2. make env   (or: cp .env.example .env and fill in your own values)
#   3. set -a; . ./.env; set +a; docker stack deploy -c deploy/stack.yml swarmdash
#
# Then read the generated admin password from the admin service's logs on
# first run (or set SWARMDASH_ADMIN_PASSWORD in .env, see below):
#      docker service logs -f swarmdash_admin
#
# Open http://<any-manager-ip>:8870 (any manager - the port is published
# via the swarm ingress mesh, so it's reachable regardless of which node
# the admin task actually landed on).
#
# --- Optional: cluster secret as a Docker secret instead of an env var ----
# The tradeoff above is deliberate for a cluster you already trust, but if
# you'd rather have the cluster secret only ever live in a tmpfs-mounted
# file (never in `docker service inspect`/`docker inspect` output, and
# immutable once created) run `make cluster-secret` to create the
# `swarmdash_cluster_secret` Docker secret from your `.env` value (or a
# freshly generated one if `.env` doesn't have one yet), then:
#   1. Uncomment the top-level `secrets:` block below and the
#      `swarmdash_cluster_secret` entry in it.
#   2. Uncomment the `secrets:` list under both `agent` and `admin` below.
#   3. Replace each service's
#        SWARMDASH_CLUSTER_SECRET: ${SWARMDASH_CLUSTER_SECRET:?...}
#      line with:
#        SWARMDASH_CLUSTER_SECRET_FILE: /run/secrets/cluster_secret
#      (every SWARMDASH_* var swarmdash reads supports this "_FILE"
#      convention - see internal/secretenv - so no code/flag changes are
#      needed, only where the value comes from.)
#   4. Redeploy.
# Docker secrets are immutable: rotating the value means creating a new
# secret (a new name, since `docker secret create` won't let you reuse
# one), updating the reference above, and redeploying - see `make
# cluster-secret`'s own comment for the exact steps. Whichever way the
# secret is delivered, use `swarmdash rotate-cluster-secret` first so
# registry passwords/GitOps tokens/the SSO client secret (encrypted with a
# key derived from it) don't become undecryptable - see docs/hardening.md.
#
# --- Optional: mTLS between admin and agent -------------------------------
# The cluster secret above is enough auth for a trusted cluster network.
# For defense in depth (or an untrusted network between nodes), run `make
# tls` to generate a CA + certs and load them as Docker secrets (certs are
# files, not sensibly passed as env vars, so this part still uses Docker
# secrets regardless of the .env approach above), then uncomment the
# `tls_*` secrets blocks below on both services AND change their
# `command:` to pass the resulting paths, e.g. for agent:
#   command: ["agent", "--tls-cert=/run/secrets/tls_agent_crt",
#             "--tls-key=/run/secrets/tls_agent_key", "--tls-ca=/run/secrets/tls_ca_crt"]
# and for admin:
#   command: ["admin", "--agent-tls-cert=/run/secrets/tls_admin_crt",
#             "--agent-tls-key=/run/secrets/tls_admin_key", "--agent-tls-ca=/run/secrets/tls_ca_crt"]
# then redeploy.
#
# --- Optional: HA admin (multiple replicas) --------------------------------
# admin's state lives in a SQLite file on whichever single node's disk the
# swarmdash_data volume is on (see the top-of-file comment), so raising
# deploy.replicas below on its own would just give every replica its own
# empty, disconnected database. Real HA needs a storage backend that isn't
# pinned to one node's disk: switch admin to --storage-driver=mongo instead
# (point it at an external/managed MongoDB deployment - this stack doesn't
# bundle one), at which point every replica talks to the same database and
# deploy.replicas can be raised freely. See the README's Storage section
# under Hardening for the full list of SWARMDASH_MONGO_* variables.

version: "3.8"

# No top-level `secrets:` block by default - the cluster secret moved to a
# plain environment variable (see the top-of-file comment). Uncomment
# `swarmdash_cluster_secret` below (plus the matching `secrets:` list under
# agent/admin) if you'd rather deliver it as a Docker secret instead - see
# "Optional: cluster secret as a Docker secret" above. TLS material always
# uses Docker secrets regardless (certs/keys are files, not sensibly passed
# as env vars); uncomment those entries plus the matching `secrets:` list
# under agent/admin if you enable mTLS:
#
# secrets:
#   swarmdash_cluster_secret:
#     external: true
#   swarmdash_tls_ca_crt:
#     external: true
#   swarmdash_tls_agent_crt:
#     external: true
#   swarmdash_tls_agent_key:
#     external: true
#   swarmdash_tls_admin_crt:
#     external: true
#   swarmdash_tls_admin_key:
#     external: true

services:
  agent:
    image: swarmdash:latest
    command: ["agent"]
    environment:
      SWARMDASH_CLUSTER_SECRET: ${SWARMDASH_CLUSTER_SECRET:?set SWARMDASH_CLUSTER_SECRET in .env}
      # Delivering the cluster secret as a Docker secret instead: comment
      # out the SWARMDASH_CLUSTER_SECRET line above, uncomment this one and
      # the "swarmdash_cluster_secret" entry in the secrets: list below -
      # see "Optional: cluster secret as a Docker secret" up top.
      # SWARMDASH_CLUSTER_SECRET_FILE: /run/secrets/cluster_secret
    # secrets:
    #   - source: swarmdash_cluster_secret
    #     target: cluster_secret
    #   - source: swarmdash_tls_ca_crt
    #     target: tls_ca_crt
    #   - source: swarmdash_tls_agent_crt
    #     target: tls_agent_crt
    #   - source: swarmdash_tls_agent_key
    #     target: tls_agent_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Host networking so admin can reach each node's agent directly at
    # <node-advertise-address>:8871, the same address Swarm itself already
    # uses for cluster control traffic - no overlay network required.
    #
    # NB: plain `network_mode: host` is silently ignored by `docker stack
    # deploy` (it only works for docker-compose/docker run, not Swarm
    # services - Swarm prints "Ignoring unsupported options: network_mode"
    # and puts the container on the overlay network instead). Attaching to
    # the pre-existing external "host" network is the documented way to
    # get real host networking for a Swarm service.
    networks:
      - hostnet
    deploy:
      mode: global
      restart_policy:
        condition: any

  admin:
    image: swarmdash:latest
    command: ["admin"]
    environment:
      SWARMDASH_CLUSTER_SECRET: ${SWARMDASH_CLUSTER_SECRET:?set SWARMDASH_CLUSTER_SECRET in .env}
      # --storage-driver defaults to "local" (SQLite); spelled out here
      # anyway since this stack's whole storage story - the volume below,
      # the single-replica pin - depends on that being the case. See
      # "Optional: HA admin" up top for switching to --storage-driver=mongo.
      SWARMDASH_STORAGE_DRIVER: local
      SWARMDASH_DATA_DIR: /data
      # Optional: bootstrap admin username, defaults to "admin" if unset.
      SWARMDASH_ADMIN_USERNAME: ${SWARMDASH_ADMIN_USERNAME:-}
      # Set this in .env to pin the bootstrap admin password instead of
      # letting swarmdash generate + log one. Either way, this account must
      # set its own password on first login (see auth.go MustChangePassword).
      SWARMDASH_ADMIN_PASSWORD: ${SWARMDASH_ADMIN_PASSWORD:-}
      # Delivering the cluster secret as a Docker secret instead: comment
      # out the SWARMDASH_CLUSTER_SECRET line above, uncomment this one and
      # the "swarmdash_cluster_secret" entry in the secrets: list below -
      # see "Optional: cluster secret as a Docker secret" up top.
      # SWARMDASH_CLUSTER_SECRET_FILE: /run/secrets/cluster_secret
    # secrets:
    #   - source: swarmdash_cluster_secret
    #     target: cluster_secret
    #   - source: swarmdash_tls_ca_crt
    #     target: tls_ca_crt
    #   - source: swarmdash_tls_admin_crt
    #     target: tls_admin_crt
    #   - source: swarmdash_tls_admin_key
    #     target: tls_admin_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Holds the SQLite database (see SWARMDASH_DATA_DIR above). Swarm's
      # default local-disk volumes aren't shared across nodes, which is
      # exactly why admin is pinned to a single manager below rather than
      # left to float - a rescheduled task on a different node would
      # otherwise start with an empty database.
      - swarmdash_data:/data
    # Published via the swarm ingress mesh (the default `mode: ingress`,
    # so `mode` is omitted below) rather than `mode: host`: any manager or
    # worker node can accept a connection to :8870 and Swarm's routing mesh
    # transparently forwards it to whichever node the admin task actually
    # landed on. That's what makes "open http://<any-manager-ip>:8870"
    # above true regardless of placement.
    ports:
      - target: 8870
        published: 8870
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any

networks:
  hostnet:
    external: true
    name: host

volumes:
  swarmdash_data:
