# Deploys swarmdash onto an existing Swarm cluster: `admin` on manager
# nodes, `agent` on every node (including managers, so you can exec into
# containers scheduled there too).
#
# admin persists all of its state (users, sessions, audit log, tokens, ...)
# in MongoDB. This stack bundles a single-replica `mongo` service for
# convenience; swap it for an external/HA MongoDB deployment (Atlas, a
# managed instance, a replica set) by deleting the `mongo` service below
# and pointing admin's SWARMDASH_MONGO_* variables at it instead.
#
# Credentials (cluster secret + MongoDB username/password) are passed as
# plain environment variables, interpolated (${VAR} below) from whatever
# process environment `docker stack deploy` itself runs in - NOT Docker
# secrets. Unlike `docker compose`, `docker stack deploy` does NOT read a
# .env file on its own, so those vars have to actually be exported into
# your shell first; `make deploy` does that for you (see its recipe), or
# do it by hand: `set -a; . ./.env; set +a; docker stack deploy ...`.
# Once deployed, the values are visible in `docker service inspect` /
# `docker inspect` on the container, unlike a secret's tmpfs-only mount.
# Simpler to manage (edit .env + redeploy, no immutable-secret dance), but
# only reach for this on a cluster you already trust for that tradeoff. If
# you want the Docker-secrets version back, the app supports both - every
# SWARMDASH_* var below also has a "_FILE" variant that reads from a
# mounted file (see README's Hardening section).
#
# The MongoDB root username/password default to mongo/password below rather
# than requiring a value in .env: the `mongo` service has no `ports:`
# entry, so - unlike `admin` - it's never published through the swarm
# ingress mesh and isn't reachable from outside the stack's own overlay
# network in the first place, making the password moot against anyone who
# can't already reach the Docker socket. Override SWARMDASH_MONGO_USERNAME/
# SWARMDASH_MONGO_PASSWORD in .env if you'd rather not rely on that (e.g.
# pointing at an external MongoDB deployment instead of the bundled one).
#
# One-shot bring-up (build image + generate .env + deploy), from a manager
# node with this repo checked out:
#
#      make deploy
#
# Or step by step:
#   1. docker build -t swarmdash:latest .   (or push/load it on every node)
#   2. make env   (or: cp .env.example .env and fill in your own values)
#   3. set -a; . ./.env; set +a; docker stack deploy -c deploy/stack.yml swarmdash
#
# Then read the generated admin password from the admin service's logs on
# first run (or set SWARMDASH_ADMIN_PASSWORD in .env, see below):
#      docker service logs -f swarmdash_admin
#
# Open http://<any-manager-ip>:8870 (any manager - the port is published
# via the swarm ingress mesh, so it's reachable regardless of which node
# the admin task actually landed on).
#
# --- Optional: mTLS between admin and agent -------------------------------
# The cluster secret above is enough auth for a trusted cluster network.
# For defense in depth (or an untrusted network between nodes), run `make
# tls` to generate a CA + certs and load them as Docker secrets (certs are
# files, not sensibly passed as env vars, so this part still uses Docker
# secrets regardless of the .env approach above), then uncomment the
# `tls_*` secrets blocks below on both services AND change their
# `command:` to pass the resulting paths, e.g. for agent:
#   command: ["agent", "--tls-cert=/run/secrets/tls_agent_crt",
#             "--tls-key=/run/secrets/tls_agent_key", "--tls-ca=/run/secrets/tls_ca_crt"]
# and for admin:
#   command: ["admin", "--agent-tls-cert=/run/secrets/tls_admin_crt",
#             "--agent-tls-key=/run/secrets/tls_admin_key", "--agent-tls-ca=/run/secrets/tls_ca_crt"]
# then redeploy.
#
# --- Optional: HA admin (multiple replicas) --------------------------------
# All admin state already lives in MongoDB, not on local disk, so scaling
# out is just raising admin's deploy.replicas below - every replica shares
# the same MongoDB deployment. The bundled `mongo` service below is a single
# unreplicated node, though (see the comment on it) - point every admin
# replica at an external MongoDB replica set instead if you want MongoDB
# itself to be HA too.

version: "3.8"

# No top-level `secrets:` block by default - the cluster secret and MongoDB
# credentials moved to plain environment variables (see the top-of-file
# comment). Only TLS material still uses Docker secrets (certs/keys are
# files, not sensibly passed as env vars); uncomment this block plus the
# matching `secrets:` list under agent/admin below if you enable mTLS:
#
# secrets:
#   swarmdash_tls_ca_crt:
#     external: true
#   swarmdash_tls_agent_crt:
#     external: true
#   swarmdash_tls_agent_key:
#     external: true
#   swarmdash_tls_admin_crt:
#     external: true
#   swarmdash_tls_admin_key:
#     external: true

services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SWARMDASH_MONGO_USERNAME:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${SWARMDASH_MONGO_PASSWORD:-password}
    volumes:
      - swarmdash_mongo_data:/data/db
    # Single replica, pinned to a manager: Swarm's default local-disk
    # volumes aren't shared across nodes, so if this task got rescheduled
    # onto a different node it would start with an empty database. Pinning
    # keeps it on one node (restart_policy still recovers it there after a
    # crash); for real HA, point admin at an external MongoDB replica set
    # instead of using this service at all (see the comment up top).
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any

  agent:
    image: swarmdash:latest
    command: ["agent"]
    environment:
      SWARMDASH_CLUSTER_SECRET: ${SWARMDASH_CLUSTER_SECRET:?set SWARMDASH_CLUSTER_SECRET in .env}
    # secrets:
    #   - source: swarmdash_tls_ca_crt
    #     target: tls_ca_crt
    #   - source: swarmdash_tls_agent_crt
    #     target: tls_agent_crt
    #   - source: swarmdash_tls_agent_key
    #     target: tls_agent_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Host networking so admin can reach each node's agent directly at
    # <node-advertise-address>:8871, the same address Swarm itself already
    # uses for cluster control traffic - no overlay network required.
    #
    # NB: plain `network_mode: host` is silently ignored by `docker stack
    # deploy` (it only works for docker-compose/docker run, not Swarm
    # services - Swarm prints "Ignoring unsupported options: network_mode"
    # and puts the container on the overlay network instead). Attaching to
    # the pre-existing external "host" network is the documented way to
    # get real host networking for a Swarm service.
    networks:
      - hostnet
    deploy:
      mode: global
      restart_policy:
        condition: any

  admin:
    image: swarmdash:latest
    command: ["admin"]
    environment:
      SWARMDASH_CLUSTER_SECRET: ${SWARMDASH_CLUSTER_SECRET:?set SWARMDASH_CLUSTER_SECRET in .env}
      # Discrete MongoDB parameters, assembled into a connection string at
      # startup. Set SWARMDASH_MONGO_URI instead if you're pointing at an
      # external deployment that needs something these can't express
      # (mongodb+srv, multiple hosts, ...); it overrides all of these.
      SWARMDASH_MONGO_HOST: mongo
      SWARMDASH_MONGO_PORT: "27017"
      SWARMDASH_MONGO_USERNAME: ${SWARMDASH_MONGO_USERNAME:-mongo}
      SWARMDASH_MONGO_PASSWORD: ${SWARMDASH_MONGO_PASSWORD:-password}
      # SWARMDASH_MONGO_DATABASE: swarmdash        # optional, this is the default
      # SWARMDASH_MONGO_AUTH_SOURCE: admin          # optional, this is the default whenever a username is set
      # SWARMDASH_MONGO_PARAMS: "replicaSet=rs0"    # optional, appended as extra query params
      # Optional: bootstrap admin username, defaults to "admin" if unset.
      SWARMDASH_ADMIN_USERNAME: ${SWARMDASH_ADMIN_USERNAME:-}
      # Set this in .env to pin the bootstrap admin password instead of
      # letting swarmdash generate + log one. Either way, this account must
      # set its own password on first login (see auth.go MustChangePassword).
      SWARMDASH_ADMIN_PASSWORD: ${SWARMDASH_ADMIN_PASSWORD:-}
    # secrets:
    #   - source: swarmdash_tls_ca_crt
    #     target: tls_ca_crt
    #   - source: swarmdash_tls_admin_crt
    #     target: tls_admin_crt
    #   - source: swarmdash_tls_admin_key
    #     target: tls_admin_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Published via the swarm ingress mesh (the default `mode: ingress`,
    # so `mode` is omitted below) rather than `mode: host`: any manager or
    # worker node can accept a connection to :8870 and Swarm's routing mesh
    # transparently forwards it to whichever node the admin task actually
    # landed on. That's what makes "open http://<any-manager-ip>:8870"
    # above true regardless of placement, and it keeps working unchanged if
    # admin is ever scaled beyond one replica.
    ports:
      - target: 8870
        published: 8870
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any

networks:
  hostnet:
    external: true
    name: host

volumes:
  swarmdash_mongo_data:
